<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Urban Rivals Agent v1</title>
<style>
  body { width: 340px; font: 13.5px system-ui, sans-serif; padding: 14px; background: #151923; color: #edf0f6; margin: 0; }
  h2 { margin: 0 0 8px; font-size: 16px; color: #93c5fd; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 12.5px; color: #cbd5e1; }
  input, select { box-sizing: border-box; width: 100%; padding: 7px 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 8px 10px; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff; }
  button.secondary { background: #334155; }
  button.danger { background: #dc2626; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { white-space: pre-wrap; margin-top: 10px; padding: 8px; border-radius: 6px; background: #0f172a; border: 1px solid #1e293b; font-size: 12.5px; min-height: 36px; }
  small { display: block; color: #94a3b8; margin-top: 8px; line-height: 1.35; }
</style>
<h2>Urban Rivals Agent v1</h2>
<label for="token">Local pairing token</label>
<input id="token" type="password" autocomplete="off" placeholder="Paste token from local/pairing-token.txt">

<label for="mode">Match format</label>
<select id="mode">
  <option value="training">Training vs Bots</option>
  <option value="efc">EFC</option>
  <option value="tourney">Tourney</option>
</select>

<label for="runMode">Run mode</label>
<select id="runMode">
  <option value="advisor">Advisor (Dry-Run HUD · no clicks)</option>
  <option value="execute">Auto-Play (clicks inside match)</option>
  <option value="inspect">Inspect (1 frame)</option>
</select>

<div class="row">
  <button id="start">Start Advisor</button>
  <button id="stop" class="danger">Stop</button>
</div>
<div class="row">
  <button id="calibrate" class="secondary">Calibrate Canvas</button>
</div>

<div id="status">Not started</div>
<small>Play once inside a match. Escape or Stop ends control immediately. Advisor mode shows live recommendations without clicking.</small>
<script src="popup.js"></script>
</html>
