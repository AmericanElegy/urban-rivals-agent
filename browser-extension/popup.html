<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Urban Rivals local agent</title>
<style>body{width:330px;font:14px system-ui;padding:14px;background:#151923;color:#edf0f6}input{box-sizing:border-box;width:100%;padding:8px;margin:8px 0}button{padding:9px;margin:6px 4px 6px 0}label{display:block}label input{width:auto}#status{white-space:pre-wrap}small{color:#b7c2d4}</style>
<h2>Local training agent</h2>
<p>Open a fresh Training Bot match at round 1, before selecting a card. Keep the game tab active.</p>
<label>Local pairing token <input id="token" type="password" autocomplete="off"></label>
<label><input id="execute" type="checkbox"> Play this Training Bot match automatically</label>
<small>Unchecked: inspect only. First live driver uses no Fury and stops on unknown cards/effects. No automatic requeue. Escape or Stop ends control.</small>
<p><button id="start">Start</button><button id="stop">Stop</button></p>
<p id="status">Not started</p>
<script src="popup.js"></script></html>
