name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Vision extras let the real-frame OCR regression tests run, not skip.
      - run: pip install -e ".[vision]"
      - run: python -m unittest discover -s tests -v
      - run: node --test browser-extension/policy.test.js browser-extension/worker.test.js browser-extension/popup.test.js
      - run: python -m urban_rivals simulate examples/basic.json --games 1 --iterations 100
      - run: python -m urban_rivals simulate examples/recorded_training.json --games 1 --iterations 100
      - run: python -m urban_rivals verify-log tests/fixtures/live_copy_battle_log.json
